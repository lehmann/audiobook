# deploy/nginx-container.conf
# nginx config that runs INSIDE the Docker container (listens on 80).
# Docker maps host port 6001 → container port 80.
# Installed to /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: all routes fall back to index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashes filenames in /assets/ — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        image/x-icon
        application/wasm;
    gzip_min_length 1024;
}
