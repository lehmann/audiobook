# deploy/nginx.conf
# Nginx site config — installed to /etc/nginx/sites-available/audiobook
# by deploy/install.sh
#
# Serves the Vite SPA (dist/) on port 6001.
# Cloudflare Tunnel forwards internet traffic to localhost:6001.

server {
    listen 6001;
    server_name _;

    root /home/lehmann/github/audiobook/dist;
    index index.html;

    # SPA: any path that isn't a real file falls back to index.html
    # (required for React Router client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite outputs content-hashed filenames in /assets/
    # Safe to cache for 1 year (cache busted automatically on deploy)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Gzip for text payloads
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        image/x-icon
        application/wasm;
    gzip_min_length 1024;
}
